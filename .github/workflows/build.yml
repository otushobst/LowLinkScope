name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -A x64 -DLOWLINK_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test analysis
        run: build/Release/analysis_tests.exe

      - name: Upload VST3 + CLAP
        uses: actions/upload-artifact@v5
        with:
          name: LowLinkScope-Windows
          path: |
            build/LowLinkScope_artefacts/Release/VST3/
            build/LowLinkScope_artefacts/Release/CLAP/